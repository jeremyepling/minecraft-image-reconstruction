<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Floating wall grid review</title>
<style>
*{box-sizing:border-box}body{font:16px/1.45 system-ui;margin:0;background:#131b24;color:#edf1f6}main{max-width:1280px;margin:auto;padding:18px}nav,.options{display:flex;gap:.6em;flex-wrap:wrap;align-items:center}button,select,textarea{font:inherit;background:#263646;color:#fff;border:1px solid #677b89;border-radius:5px;padding:.4em .7em}button,select,summary{cursor:pointer}textarea{display:block;width:100%;margin:.6em 0}h1{font-size:1.6em;margin:.5em 0}.context{display:grid;grid-template-columns:minmax(220px,1fr) 1fr;gap:18px;align-items:center}.context img{width:100%;max-height:290px;object-fit:contain;background:#0c1118}.gallery{display:grid;grid-template-columns:1fr 1fr;gap:12px}figure{margin:0;background:#202e3b;padding:8px}figcaption{padding-bottom:.4em;font-weight:600}.gallery img,details img{width:100%;height:245px;object-fit:contain;background:#101820}img{cursor:zoom-in}dialog{max-width:96vw;background:#15202b;color:white;border:0}dialog img{width:auto;height:auto;max-width:90vw;max-height:80vh}details{margin:12px 0}small{color:#bdcbd6}@media(max-width:650px){.context,.gallery{grid-template-columns:1fr}}
</style>
<main><nav><button id="prev">← Previous</button><select id="pick" aria-label="Case"></select><button id="next">Next →</button></nav><h1 id="heading"></h1><div class="context"><img id="source" alt="Source image with the review area outlined in yellow"><section><h2>What would you use as evidence?</h2><p id="question"></p><small>The yellow box locates the crop. Cyan lines show candidate block cells. Click an image to enlarge it.</small></section></div><div class="gallery" id="gallery"></div><details id="reveal"><summary>Show reference face boundaries and measured outcome</summary><div id="answer"></div></details>
<label for="prefer">Which grid would you trust on this wall?</label> <select id="prefer"><option value="">Choose</option><option>A</option><option>B</option><option>Only part of A or B</option><option>Neither</option><option>Unsure</option></select>
<label for="notes"><textarea id="notes" rows="3" placeholder="Where does the grid go wrong? Name an edge, block, opening or change in texture."></textarea></label><button id="download">Download feedback</button> <small id="status"></small></main>
<dialog id="zoom"><button onclick="zoom.close()">Close</button><br><img id="large" alt="Enlarged review image"></dialog>
<script>
const cases=__CASES__,key="floating-wall-review-v1",el=id=>document.getElementById(id);
let answers={};try{answers=JSON.parse(localStorage.getItem(key)||"{}")}catch{}
let idx=Math.max(0,cases.findIndex(c=>"#"+c.id===location.hash));
const make=(tag,txt)=>{let e=document.createElement(tag);if(txt)e.textContent=txt;return e};
function enlarge(im){im.onclick=()=>{el("large").src=im.src;el("zoom").showModal()}}
function fig(pair){let f=make("figure"),i=make("img");f.append(make("figcaption",pair[0]),i);i.src=pair[1];i.alt=pair[0];enlarge(i);return f}
function show(n){idx=(n+cases.length)%cases.length;let c=cases[idx];location.hash=c.id;el("pick").selectedIndex=idx;el("heading").textContent=c.title+" · "+c.wall;el("question").textContent=c.question;el("source").src=c.context;enlarge(el("source"));el("gallery").replaceChildren(...c.panels.slice(0,4).map(fig));el("answer").replaceChildren(fig(c.panels[4]));for(let j=0;j<2;j++){let [tp,fp,id,f1]=c.stats[j];el("answer").append(make("p",(j?"Changed export":"Previous export")+" · "+tp+" correct positions · "+fp+" extras · "+id+" exact position and material matches · "+f1+"% placement F1"))}el("answer").append(make("small","Scores cover the entire structure. The panels show the selected wall. Reference boundaries include all visible structure faces in the crop."));el("reveal").open=false;el("prefer").value=answers[c.id]?.preferred||"";el("notes").value=answers[c.id]?.comment||"";el("status").textContent=""}
function save(){let c=cases[idx];answers[c.id]={case:c.title,wall:c.wall,preferred:el("prefer").value,comment:el("notes").value};try{localStorage.setItem(key,JSON.stringify(answers));el("status").textContent="Saved in this browser"}catch{el("status").textContent="Use Download feedback to save a copy"}}
cases.forEach(c=>el("pick").append(make("option",c.title)));el("pick").onchange=e=>show(e.target.selectedIndex);el("prev").onclick=()=>show(idx-1);el("next").onclick=()=>show(idx+1);el("notes").oninput=save;el("prefer").onchange=save;el("download").onclick=()=>{let a=make("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(answers,null,2)],{type:"application/json"}));a.download="floating-wall-feedback.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};show(idx);
</script></html>
