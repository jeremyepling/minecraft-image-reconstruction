<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shared corners · Visible build review</title>
<style>
:root{color-scheme:dark;font:16px/1.45 system-ui;background:#101920;color:#edf2f5}body{max-width:1460px;margin:0 auto;padding:20px}header,nav{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header{justify-content:space-between;margin-bottom:12px}h1,h2,p{margin:.35em 0}h1{font-size:1.65rem}h2{font-size:1.1rem}a{color:#9ddfff}select,button{font:inherit;background:#23333e;color:inherit;border:1px solid #526674;border-radius:6px;padding:7px}label{display:inline-grid;gap:3px;font-size:.9rem}main{display:grid;grid-template-columns:minmax(0,2.3fr) minmax(365px,1fr);gap:14px}section,aside{background:#18242c;border-radius:10px;padding:14px}svg{width:100%;height:auto;display:block;background:#202e38;margin:12px 0}.legend,small{color:#b6c8d3}table{border-collapse:collapse;width:100%;font-size:.92rem;margin:12px 0}td,th{text-align:right;border-bottom:1px solid #374953;padding:5px}th:first-child,td:first-child{text-align:left}.pair{width:100%;text-align:left;margin:3px 0;font-size:.9rem}.selected{outline:2px solid #a8d6ff}#list{max-height:35vh;overflow:auto}.geometry{color:#91ecd1}@media(max-width:800px){main{grid-template-columns:1fr}body{padding:10px}}
</style>
<header><h1>Shared block rows across a corner</h1><label>Structure <select id="scene"></select></label></header>
<main><section><nav><label>View <select id="mode"><option value="seams">Candidate joins</option><option value="masks">Surface outlines and joins</option><option value="reference">Recorded shared edges</option><option value="grids">Exported face grids</option><option value="before">Baseline placement</option><option value="sparse">Placement with original donor + side</option><option value="after">Row-transfer placement</option></select></label></nav>
<svg id="canvas" role="img" aria-label="Selected source image with corner overlay"></svg><p id="legend" class="legend"></p></section>
<aside><h2 id="title"></h2><p id="result"></p><table><thead><tr><th>Placement</th><th>Baseline</th><th>Original donor + side</th><th>Rebuilt donor</th><th>Rebuilt + side</th></tr></thead><tbody id="scores"></tbody></table>
<h2>Inspect a seam</h2><p id="hint"></p><div id="list"></div><p id="detail" class="geometry" aria-live="polite"></p><p id="truth"></p></aside></main>
<script src="corner-data.js"></script><script>
const $=id=>document.getElementById(id), ns='http://www.w3.org/2000/svg';
function svg(name,attrs){const node=document.createElementNS(ns,name);for(const [k,v] of Object.entries(attrs))node.setAttribute(k,v);return node}
let frame=0,selection=0;
function display(){const c=cornerCases[frame],mode=$('mode').value,s=c.seams[selection],el=$('canvas');
el.replaceChildren();el.setAttribute('viewBox','0 0 '+c.size.join(' '));el.append(svg('image',{href:c.images[mode],width:c.size[0],height:c.size[1]}));
const placement=['before','after','sparse'].includes(mode);
if(mode==='reference'){const refs=c.references||[];for(const v of refs){const [a,b]=v.endpoints;el.append(svg('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:'#53e8ed','stroke-width':4}));const label=svg('text',{x:a[0]+4,y:a[1],fill:'white',stroke:'#16212c','stroke-width':3,'paint-order':'stroke','font-size':16});label.textContent=v.label;el.append(label)}}else if(!placement && mode!=='grids'){c.seams.forEach((v,i)=>{if(!v.endpoints||v.endpoints.length!==2)return;const [a,b]=v.endpoints;
const line=(stroke,width)=>svg('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke,'stroke-width':width,'stroke-linecap':'round'});
const layer=svg('g',{});layer.append(line('#14212b',i===selection?12:6),line(v.accepted?'#53efac':'#ffab71',i===selection?7:3));layer.addEventListener('click',()=>{selection=i;display()});el.append(layer);
});if(s?.geometry?.row_ticks){for(const [x,y] of s.geometry.row_ticks){el.append(svg('line',{x1:x-8,y1:y,x2:x+8,y2:y,stroke:'white','stroke-width':2}))}}if(s?.endpoints){for(const [x,y] of s.endpoints){el.append(svg('circle',{cx:x,cy:y,r:7,stroke:'white',fill:'#101920','stroke-width':3}))}}}
$('legend').textContent=placement?c.placementLegend:mode==='reference'?'Cyan marks reference edges. Labels show the mask pair and the measured run in block rows. This view uses recorded geometry for diagnosis.':mode==='grids'?'Green outlines show measured cells in the exported group. Blue outlines show other measured cells. Gold marks accepted unit edges.':'Green = accepted transfer. Orange = rejected candidate. White rings mark the selected seam’s endpoints. White ticks mark its projected row boundaries.';
$('title').textContent=c.title;$('result').textContent=c.summary;
$('scores').replaceChildren();for(const values of c.metrics){const row=document.createElement('tr');for(const v of values){const col=document.createElement('td');col.textContent=v;row.append(col)}$('scores').append(row)}
$('list').replaceChildren();c.seams.forEach((v,i)=>{const b=document.createElement('button');b.textContent=v.donor+' → '+v.receiver+' · '+v.decision;b.className='pair'+(i===selection?' selected':'');b.setAttribute('aria-pressed',i===selection);b.onclick=()=>{selection=i;if(placement)$('mode').value='seams';display()};$('list').append(b)});
$('hint').textContent=c.seams.length?'Select a pair to see its measured rows and decision.':'No eligible shared edge reached the row-transfer test.';
$('detail').textContent=s?s.description:'';$('truth').textContent=s?.truth||'';
}
cornerCases.forEach((c,i)=>$('scene').add(new Option(c.title,i)));
function pick(){frame=Number($('scene').value);selection=Math.max(0,cornerCases[frame].seams.findIndex(v=>v.donor==='S03'&&v.receiver==='S04'));display()}
$('scene').onchange=pick;$('mode').onchange=display;pick();
</script></html>
