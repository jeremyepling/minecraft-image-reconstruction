name: Exterior regression set
on:
  push:
    branches: ['**']
    paths:
      - 'benchmark/**'
      - 'engine/**'
      - 'calibration/**'
      - 'runtime/**'
      - 'tests/**'
      - 'reconstruct.py'
      - '.github/workflows/exterior.yml'
  pull_request:
    paths:
      - 'benchmark/**'
      - 'engine/**'
      - 'calibration/**'
      - 'runtime/**'
      - 'tests/**'
      - 'reconstruct.py'
      - '.github/workflows/exterior.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: benchmark/suites/requirements.txt
      - run: python -m pip install -r benchmark/suites/requirements.txt
      - run: python -m unittest discover -s tests
      - run: python -m benchmark.exterior_suite --out runs/exterior/ci-${{ github.run_id }}-${{ github.run_attempt }}
      - run: python -m benchmark.surface_round --out runs/surfaces/ci-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        with:
          name: exterior-v1-${{ github.sha }}
          path: runs/exterior/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: visible-surfaces-${{ github.sha }}
          path: runs/surfaces/
          if-no-files-found: error
